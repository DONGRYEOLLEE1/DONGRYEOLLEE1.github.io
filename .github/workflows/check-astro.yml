name: Astro build and content checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Preserve migration verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: content-migration-check
          path: generated/build-verification.json
          if-no-files-found: ignore
