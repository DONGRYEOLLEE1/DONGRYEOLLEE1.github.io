<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1810" viewBox="0 0 1600 1810">
  <title>홈과 전체 글 목록 구조 제안</title>
  <desc>대표 연구는 두 열 카드로, 기존 기술 기록은 텍스트 목록으로 보여준다. 전체 글 목록에는 주제와 유형 필터, 결과 수, 정렬을 제공한다. 오른쪽 모바일 예시는 같은 정보를 한 열로 배치한다. 최종 디자인이나 실제 검색 결과를 나타내지 않는 구조 검토용 와이어프레임이다.</desc>
